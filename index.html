:root{
  --ink:#16213E; --paper:#F4F8FF; --panel:#FFFFFF; --pitch:#1E7A3C; --pitch-2:#25914A;
  --hero:#E4332D; --spark:#FFD23F; --muted:#56607A; --line:#16213E; --ok:#1E7A3C; --bad:#E4332D;
  --shadow:4px 4px 0 var(--line);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF0FF; --paper:#0F1730; --panel:#18234A; --muted:#A9B3D1; --line:#050914;
    --pitch:#2FA457; --pitch-2:#37B863;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF0FF; --paper:#0F1730; --panel:#18234A; --muted:#A9B3D1; --line:#050914;
  --pitch:#2FA457; --pitch-2:#37B863;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; line-height:1.5}
h1,h2,h3,.comic{font-family:"Bangers","Impact","Arial Black",sans-serif; font-weight:400; letter-spacing:.03em; line-height:1.1; margin:0}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--spark); outline-offset:3px}
.wrap{max-width:760px; margin:0 auto; padding:16px 16px 110px}

/* hero header */
.top{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.emblem{width:58px; height:58px; flex:none}
.who{flex:1; min-width:0}
.who h1{font-size:30px}
.league{font-size:14px; color:var(--muted); font-weight:700}
.coach{background:transparent; border:2px solid var(--line); border-radius:10px; padding:6px 10px; font-weight:800; font-size:14px; color:var(--ink)}
.bar{height:10px; border:2px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel); margin-top:4px; max-width:240px}
.bar>i{display:block; height:100%; background:var(--spark)}

/* comic panels: the one bold device */
.panel{background:var(--panel); border:3px solid var(--line); box-shadow:var(--shadow); border-radius:4px; padding:18px; margin-bottom:22px; position:relative}
.panel.match{background:var(--pitch); color:#fff; transform:rotate(-.6deg);
  background-image:repeating-linear-gradient(90deg,transparent 0 44px,rgba(255,255,255,.06) 44px 88px)}
.panel.mission{transform:rotate(.5deg);
  background-image:radial-gradient(circle,rgba(228,51,45,.14) 1.4px,transparent 1.6px); background-size:10px 10px}
.panel h2{font-size:32px; margin-bottom:6px}
.bubble{display:inline-block; background:var(--spark); color:#16213E; border:3px solid var(--line); border-radius:18px; padding:6px 14px; font-weight:800; position:relative; margin:4px 0 12px}
.bubble::after{content:""; position:absolute; left:22px; bottom:-12px; border:9px solid transparent; border-top-color:var(--line); border-bottom:0}
.btn{display:inline-block; background:var(--spark); color:#16213E; border:3px solid var(--line); box-shadow:3px 3px 0 var(--line); border-radius:6px; padding:10px 18px; font-weight:800; font-size:17px}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--panel); color:var(--ink)}
.btn.red{background:var(--hero); color:#fff}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.streak{display:flex; gap:6px; margin-top:4px}
.streak span{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:var(--panel)}
.streak span.on{background:var(--spark)}

/* plan */
.plan{list-style:none; padding:0; margin:12px 0 0}
.plan li{display:flex; align-items:center; gap:12px; padding:12px; border:3px solid var(--line); background:var(--panel); color:var(--ink); border-radius:4px; margin-bottom:10px}
.plan .n{font-family:"Bangers",Impact,sans-serif; font-size:26px; width:36px; text-align:center}
.plan .t{flex:1}
.plan .done{color:var(--ok); font-weight:800}

/* quiz */
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:14px 0}
.opt{border:3px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:14px; font-size:20px; font-weight:800}
.opt.right{background:var(--pitch); color:#fff}
.opt.wrong{background:var(--hero); color:#fff}
.q{font-size:26px; font-weight:800}
.progress{font-weight:800; color:var(--muted)}

/* styles tabs */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px}
.tab{border:3px solid var(--line); background:var(--panel); color:var(--ink); border-radius:20px; padding:6px 14px; font-weight:800}
.tab[aria-pressed="true"]{background:var(--spark); color:#16213E}
.explain{white-space:pre-line}

/* cards */
.flash{min-height:190px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; font-size:26px; font-weight:800}
.boxes{display:flex; gap:8px; margin-top:10px}
.boxes div{flex:1; border:2px solid var(--line); border-radius:4px; text-align:center; padding:6px 0; background:var(--panel)}
.boxes b{display:block; font-size:22px}

/* timer */
.clock{display:block; margin:10px auto; width:220px; height:220px; max-width:100%}
.clock text{font-family:"Bangers",Impact,sans-serif; font-size:44px; fill:var(--ink)}

/* forms */
textarea,input[type=text],input[type=password]{width:100%; border:3px solid var(--line); border-radius:6px; background:var(--panel); padding:10px; font-size:17px}
textarea{min-height:110px; resize:vertical}
.list{list-style:none; padding:0; margin:12px 0 0}
.list li{border-bottom:2px dashed var(--muted); padding:10px 0}
.tag{display:inline-block; border:2px solid var(--line); border-radius:10px; padding:0 8px; font-size:13px; font-weight:800; margin-right:6px}
.steps{list-style:none; padding:0}
.steps button{width:100%; text-align:left; border:3px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:12px; margin-bottom:8px; font-weight:700}
.steps button.right{background:var(--pitch); color:#fff}
.steps button.wrong{background:var(--hero); color:#fff}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%}
td,th{border:2px solid var(--line); padding:6px 8px; text-align:left}

/* nav */
nav{position:fixed; left:0; right:0; bottom:0; background:var(--ink); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5}
nav .in{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
nav button{background:none; border:0; color:var(--paper); padding:10px 4px 12px; font-weight:800; font-size:14px; display:flex; flex-direction:column; align-items:center; gap:2px}
nav button svg{width:26px; height:26px}
nav button[aria-current="page"]{color:var(--spark)}
.toast{position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--spark); color:#16213E; border:3px solid #16213E; border-radius:8px; padding:8px 16px; font-weight:800; z-index:9; display:none}
.back{background:none; border:0; font-weight:800; color:var(--ink); padding:0; margin-bottom:12px}
/* ilustrácie */
.art{display:block; width:100%; height:auto; margin:6px 0 10px}
.panel .art-side{float:right; width:38%; max-width:210px; margin:-6px -6px 6px 12px}
.panel::after{content:""; display:block; clear:both}
.avatar{width:64px; height:84px; flex:none; background:none; border:0; padding:0}
.avatar svg{width:100%; height:100%}
.burst{display:block; width:180px; margin:6px auto 0}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}70%{transform:scale(1.1) rotate(3deg)}100%{transform:scale(1)}}
/* hrdina – builder */
.builder{display:grid; grid-template-columns:minmax(0,160px) 1fr; gap:16px; align-items:start}
.builder .big svg{width:100%; height:auto}
.choice{margin-bottom:12px}
.choice .row{gap:8px}
.sw{width:38px; height:38px; border-radius:50%; border:3px solid var(--line); padding:0}
.sw[aria-pressed="true"],.gd[aria-pressed="true"]{outline:3px solid var(--spark); outline-offset:2px}
.gd{width:58px; height:58px; border:3px solid var(--line); border-radius:8px; background:var(--panel); padding:4px}
.gd svg{width:100%; height:100%}
@media (max-width:480px){ .builder{grid-template-columns:1fr} .builder .big{max-width:170px; margin:0 auto} }
/* úvod + rozvrh */
.hello{display:flex; gap:16px; align-items:center; padding-right:90px}
.hello-hero{width:110px; flex:none}
.hello-hero svg{width:100%; height:auto}
.hello-text{flex:1; min-width:0}
.hello-text h1{font-size:40px}
.status{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
.badge{display:inline-block; background:var(--hero); color:#fff; border:3px solid var(--line); border-radius:8px 8px 14px 14px; padding:2px 12px; font-family:"Bangers",Impact,sans-serif; font-size:20px; letter-spacing:.04em}
.stars{font-family:"Bangers",Impact,sans-serif; font-size:26px}
.track{display:block; width:100%; max-width:320px; height:auto; margin:8px 0 4px}
.wds{display:flex; gap:4px; margin-top:8px}
.wd{display:flex; flex-direction:column; align-items:center; font-size:12px; font-weight:800; color:var(--ink); width:34px}
.wd.now span{background:var(--spark); color:#16213E; border-radius:6px; padding:0 4px}
@media (max-width:600px){ .status{grid-template-columns:1fr} }
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px}
.tile{position:relative; text-align:left; background:var(--panel); color:var(--ink); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); border-radius:4px; padding:14px 14px 14px 22px; min-height:96px; display:flex; flex-direction:column; justify-content:center; gap:4px; overflow:hidden}
.tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:12px; background:var(--c)}
.tile:disabled{opacity:.55; cursor:default}
.tile:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--line)}
.tile .hour{font-family:"Bangers",Impact,sans-serif; font-size:20px; color:var(--muted)}
.tile .nm{font-family:"Bangers",Impact,sans-serif; font-size:28px; line-height:1.05}
.tile .soon{font-size:14px; font-weight:800}
.subj-head{border-left:18px solid var(--c); transform:rotate(-.5deg)}
.subj-head h2{text-shadow:3px 3px 0 var(--c)}
@media (max-width:480px){ .hello{align-items:flex-start; gap:10px; padding-right:14px; padding-top:50px} .hello-hero{width:64px} .hello-text h1{font-size:28px} .tabs .tab{padding:6px 11px} }
/* ateliér */
.canvasbox{border:3px solid var(--line); box-shadow:var(--shadow); background:#fff; touch-action:none; border-radius:4px; overflow:hidden}
.canvasbox canvas{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair}
.tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0}
.tool{border:3px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; min-width:44px; height:44px; padding:0 10px; font-weight:800}
.tool[aria-pressed="true"]{background:var(--spark); color:#16213E}
.tool svg{width:30px; height:30px; vertical-align:middle}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:12px}
.gallery img{width:100%; border:3px solid var(--line); border-radius:4px; background:#fff}
.creation-img{max-width:100%; border:3px solid var(--line); border-radius:4px; margin-top:6px; background:#fff}
@media (prefers-reduced-motion: reduce){ .panel.match,.panel.mission{transform:none} *{transition:none!important; animation:none!important} }
@media (max-width:420px){ .opts{grid-template-columns:1fr} .panel h2{font-size:28px} }
</style>
</head>

<div class="wrap" id="app"></div>
<nav aria-label="Hlavná navigácia"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" role="status"></div>
